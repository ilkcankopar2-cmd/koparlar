 geçince tek deneme.","bitti":"Film testi yeşil.","ornek":null,"hafta":19,"tarih":"2027-02-27","tarihYazi":"27 Şubat 2027 cumartesi","haftaninGunu":6,"birlestirme":true},{"n":115,"konu":"Ölç, sonra değiştir.","ozet":"Hissiyat hız değildir. Önce sayı, sonra tek değişiklik.","ayrinti":"Bir ucu seç: GET /notes. 200 istek, eşzamanlılık 10. p50 ve en yavaşı yaz. Sonra tek şeyi değiştir, aynı ölçümü tekrarla. İki değişikliği birden yapma, hangisi etkiledi bilmezsin. Bugün yalnız ilk ölçüm.","uygulama":"Yük döngüsünü çalıştır.\nSayıları gün notuna yaz.\nKodu değiştirme.","bitti":"Sayılar yazılı. Bu günkü diff'te hız iddiası yok, yalnız ölçer.","ornek":null,"hafta":20,"tarih":"2027-03-01","tarihYazi":"1 Mart 2027 pazartesi","haftaninGunu":1,"birlestirme":false},{"n":116,"konu":"Kısa yük deneyi.","ozet":"Aynı ölçümü bir kez daha, tek değişiklikten sonra.","ayrinti":"Değişiklik olarak önbelleği aç veya kapat. Başka bir şeye dokunma. İki ölçüm yan yana. Fark yoksa bunu da yaz. Fark yoksa başarıdır, çünkü önbellek küçük veride görünmeyebilir.","uygulama":"Önbellek kapalı ve açık iki sayı.\nAynı istek sayısı.\nGün notunda tek cümlelik sonuç.","bitti":"İki ölçüm ve bir cümle var.","ornek":null,"hafta":20,"tarih":"2027-03-02","tarihYazi":"2 Mart 2027 salı","haftaninGunu":2,"birlestirme":false},{"n":117,"konu":"Senkron şifre özeti döngüyü kilitler.","ozet":"Doğrulama sürerken sağlık ucu bekliyorsa özet senkron çalışıyordur.","ayrinti":"Bunu yeniden ölç. Async scrypt iken sağlık ucu kısa dönmeli. Sync bir yol kalmışsa bugün bitsin. Yük sayısıyla birlikte yaz.","uygulama":"Giriş yükü altında /health süresini ölç.\nSync çağrı araması yap: scryptSync kodda olmasın.","bitti":"Health, giriş yükü altında makul sürede. scryptSync yok.","ornek":null,"hafta":20,"tarih":"2027-03-03","tarihYazi":"3 Mart 2027 çarşamba","haftaninGunu":3,"birlestirme":false},{"n":118,"konu":"Havuz boyutu.","ozet":"Daha büyük havuz her zaman daha hızlı değildir.","ayrinti":"10 ve 2 ile aynı yükü ölç. 2 sıraya sokar. 10 yetiyorsa 30 yapma. Postgres max_connections sonludur; havuz onu aşarsa bağlantı reddedilir. Sayını yaz, boyutu gerekçeyle bırak.","uygulama":"İki havuz boyutu, iki ölçüm.\nSon boyutu kodda sabitle ve nedenini gün notuna yaz.","bitti":"Ölçüm ve gerekçe yazılı. Boyut ölçülmeden 100 değil.","ornek":null,"hafta":20,"tarih":"2027-03-04","tarihYazi":"4 Mart 2027 perşembe","haftaninGunu":4,"birlestirme":false},{"n":119,"konu":"Gereksiz alan gönderme.","ozet":"Liste ucu, istemcinin kullanmadığı sütunu taşımasın.","ayrinti":"select * yerine id, text, created_at. user_id liste cevabında şart değil. Büyük metin bir gün eklense bile liste kısa kalsın. Ayrıntı ucu yoksa ekleme. Sözleşme değişir: fazla alan göndermeyi kesmek, istemci onu kullanıyorsa kırmadır. Bugün alan listesi kısa ve testli.","uygulama":"Cevap şeklini teste yaz: yalnız id, text, created_at.\nSorgu aynı sütunları seçsin.\nexplain şart değil, bugün şekil yeter.","bitti":"Test, ek alan olmadığını görüyor.","ornek":null,"hafta":20,"tarih":"2027-03-05","tarihYazi":"5 Mart 2027 cuma","haftaninGunu":5,"birlestirme":false},{"n":120,"konu":"Haftalık: bir ucun süre bütçesi yazılır.","ozet":"GET /notes için bir bütçe: bu makinede en yavaş istek şu ms'nin altında.","ayrinti":"Bütçe, başkasının makinesinden kopyalanmaz. Senin ölçümün. Testte flaky bir süre kilidi koyma. Bütçe gün notunda ve servis notunda durur.","uygulama":"Son ölçümü servis notuna yaz.\nHavuz boyutu, önbellek ve sütunlar o notta gerekçeli olsun.","bitti":"Servis notunda bütçe var. Süre testi yok, ölçüm notu var.","ornek":null,"hafta":20,"tarih":"2027-03-06","tarihYazi":"6 Mart 2027 cumartesi","haftaninGunu":6,"birlestirme":true},{"n":121,"konu":"Alan eklemek, alan silmek.","ozet":"Cevaba alan eklemek eski istemciyi bozmaz. Alan silmek veya adını değiştirmek bozar.","ayrinti":"text'i body yapmak istesen eski istemci düşer. Yeni alan noteText ekleyip text'i bir süre tutmak uyumlu yoldur. Bugün yeni bir alan ekle: createdAt, eskisi created_at ise istemciye camelCase ver, veritabanı snake_case kalsın. İkisini karıştırma.","uygulama":"Cevaba createdAt ekle.\ntext hâlâ orada olsun.\nEski testi, text ve id bekleyerek geçir.\nYeni test createdAt'e baksın.","bitti":"Eski alanlar duruyor. Yeni alan ekli. İsim dönüşümü tek yerde.","ornek":null,"hafta":21,"tarih":"2027-03-08","tarihYazi":"8 Mart 2027 pazartesi","haftaninGunu":1,"birlestirme":false},{"n":122,"konu":"Yol sürümü.","ozet":"Kıran değişiklik yeni yola gider. Eski yol bir süre durur.","ayrinti":"/v1/notes bugünkü sözleşmedir. /v2 açma, kıran bir değişikliğin yok. Yolu şimdiden /v1 yapmak, sonra kırmamak için yer açar. Yönlendirme: /notes, /v1/notes'a gitsin ki eski denemelerin kırılmasın.","uygulama":"Uçları /v1 altına al.\n/notes 307 veya uygulama içi aynı işleve gitsin.\nTestler /v1 kullansın.","bitti":"Testler /v1 ile yeşil. /notes hâlâ çalışıyor.","ornek":null,"hafta":21,"tarih":"2027-03-09","tarihYazi":"9 Mart 2027 salı","haftaninGunu":2,"birlestirme":false},{"n":123,"konu":"Eski istemci.","ozet":"Eski istemci yeni zorunlu alanı bilmez.","ayrinti":"POST gövdesinde yalnız text yeter. createdAt istemciden gelirse reddet, onu sen üretirsin. İstemcinin verdiği id'yi kabul etme. Kabul edersen kimlik ve yetki karışır.","uygulama":"Gövdede id veya createdAt gelirse 400.\nYalnız text gelince 201.\nBunu test et.","bitti":"İki test yeşil.","ornek":null,"hafta":21,"tarih":"2027-03-10","tarihYazi":"10 Mart 2027 çarşamba","haftaninGunu":3,"birlestirme":false},{"n":124,"konu":"Kısa OpenAPI.","ozet":"Sözleşme, sohbetin içinde kalmasın. Kısa bir belge olsun.","ayrinti":"Bütün özel söz dizimine girme. Yollar, metodlar, gövde, cevap, hata kodları. Elle yaz. Üreteç bugün yok. Belge ile kod ayrılırsa belge yalan olur; yarın test onu tutacak.","uygulama":"openapi.yaml yaz: /v1/notes GET POST, DELETE, /v1/login, hata şekli.\nUzun açıklama yazma.","bitti":"Dosya yolların hepsini sayıyor. Kodda olup belgede olmayan uç kalmadı.","ornek":null,"hafta":21,"tarih":"2027-03-11","tarihYazi":"11 Mart 2027 perşembe","haftaninGunu":4,"birlestirme":false},{"n":125,"konu":"Sözleşme testi.","ozet":"Cevap, belgedeki zorunlu alanları taşır. Fazla alan belgeye aykırıysa düşer.","ayrinti":"Bugün belgeye bakıp elle assert yazman yeter. id, text, createdAt zorunlu. Başka anahtar varsa test düşsün. Hata gövdesi error.code ve error.message. Bu test belgeden üretilmek zorunda değil.","uygulama":"Bir test GET cevabının anahtar kümesini birebir karşılaştırsın.\nBir test hata şeklini karşılaştırsın.","bitti":"İki test yeşil. Yeni alan ekleyince test düşünce belgeyi de güncelliyorsun.","ornek":null,"hafta":21,"tarih":"2027-03-12","tarihYazi":"12 Mart 2027 cuma","haftaninGunu":5,"birlestirme":false},{"n":126,"konu":"Haftalık: sürüm bir donar.","ozet":"/v1 sözleşmesi bu hafta kilitlenir. Değişiklik ya uyumludur ya da yeni sürüm ister.","ayrinti":"Belge, test ve kod aynı şekli söyler.","uygulama":"Uç listesini belgeden, testten ve routes'tan yaz.\nÜç liste aynı olsun.\nBunu gün notuna koy.","bitti":"Üç liste aynı. /v1 dışında gizli uç yok.","ornek":null,"hafta":21,"tarih":"2027-03-13","tarihYazi":"13 Mart 2027 cumartesi","haftaninGunu":6,"birlestirme":true},{"n":127,"konu":"ILIKE ve sınırı.","ozet":"Ortadan arama, sıradan indeks kullanamaz.","ayrinti":"where text ilike '%' || $1 || '%' küçük tabloda olur. Büyüyünce seq scan görürsün. Bugün bunu explain ile gör ve kabul et. Ayrı bir arama motoru ekleme. Sorgu parametresi q. Boş q, filtresiz sayfadır. % ve _ karakterini kullanıcının jokerine bırakma; kaçışla.","uygulama":"q ile arama yap.\n% karakterini kaçır.\nexplain çıktısını gün notuna koy.\nYeni arama ürünü kurma.","bitti":"Test: % araması joker gibi bütün tabloyu döndürmüyor. explain notu duruyor.","ornek":null,"hafta":22,"tarih":"2027-03-15","tarihYazi":"15 Mart 2027 pazartesi","haftaninGunu":1,"birlestirme":false},{"n":128,"konu":"Kararlı sıralama.","ozet":"Aynı anda yazılmış iki notun sırası her okumada aynıdır.","ayrinti":"order by created_at desc, id desc. Yalnız created_at, eşit zamanda sırayı değiştirir, sayfa tekrar eder veya atlar. İmleç de bu sıraya uymalı. Yalnız id ile sayfalıyorsan created_at sırası ile çelişme.","uygulama":"Aynı milisaniyede iki not ekle.\nListe sırası iki okumada aynı olsun.\nSayfa bunu bölerken not kaybolmasın.","bitti":"Test, tekrar ve kayıp olmadığını gösteriyor.","ornek":null,"hafta":22,"tarih":"2027-03-16","tarihYazi":"16 Mart 2027 salı","haftaninGunu":2,"birlestirme":false},{"n":129,"konu":"Yumuşak silme.","ozet":"Silinen satır tabloda kalır, listede görünmez.","ayrinti":"deleted_at null ise yaşıyor. Liste where deleted_at is null. DELETE bunu set eder. Geri alma bugün yok. Unique kurallar yumuşak silineni de tutar; aynı metin yeniden eklenebilir, metin unique değil. İşçi artçı işi yumuşak silmede de bir kez çalışır.","uygulama":"Migration deleted_at eklesin.\nSilinen not listede olmasın, tabloda olsun.\nExport da onu yazmasın.","bitti":"Üç test: liste, tablo, export.","ornek":null,"hafta":22,"tarih":"2027-03-17","tarihYazi":"17 Mart 2027 çarşamba","haftaninGunu":3,"birlestirme":false},{"n":130,"konu":"Kim ne zaman değiştirdi.","ozet":"Denetim izi, notun kendisinden ayrı bir tablodur.","ayrinti":"note_events(id, note_id, user_id, action, at). action: created, deleted. Metnin tamamını iz tablosuna kopyalama. İz, iş kuralının transaction'ında yazılsın. İz yazılmazsa not da commit olmasın.","uygulama":"Ekleme ve silme tek transaction'da iz bıraksın.\nİz yazımı hata verirse not da kalmasın.\nKullanıcı kendi izini okusun, başkasını okumasın.","bitti":"İki test: iz var, iz düşünce not yok. Yetki duruyor.","ornek":null,"hafta":22,"tarih":"2027-03-18","tarihYazi":"18 Mart 2027 perşembe","haftaninGunu":4,"birlestirme":false},{"n":131,"konu":"Dışa aktarma kuyrukta.","ozet":"Export isteği dosyayı hemen üretmez. İş bırakır, cevap 202 döner.","ayrinti":"202 kabul edildi, iş bitmedi demektir. İşçi satırları yazar. Bittiğini görmek için GET /v1/exports/:id. Büyük liste istek içinde üretilmez. Eski anlık export'u kaldırmak kıran değişikliktir; /v1 içindeysen belgeyi ve testi birlikte güncelle.","uygulama":"POST /v1/exports 202 ve bir id dönsün.\nİşçi bitirince GET o kaydı hazır görsün.\nBaşkasının export kaydı 403 olsun.","bitti":"Üç adım testte. İstek, export bitene kadar beklemiyor.","ornek":null,"hafta":22,"tarih":"2027-03-19","tarihYazi":"19 Mart 2027 cuma","haftaninGunu":5,"birlestirme":false},{"n":132,"konu":"Haftalık: arama ve yumuşak silme.","ozet":"Arama, sayfa, yumuşak silme, iz ve kuyrukta export aynı serviste.","ayrinti":"Yeni ürün yok. Sözleşme testi güncel.","uygulama":"Film: not ekle, ara, sil, listede yok, izde deleted var, export işi onu içermiyor.","bitti":"Film testi yeşil. Belge bu uçları sayıyor.","ornek":null,"hafta":22,"tarih":"2027-03-20","tarihYazi":"20 Mart 2027 cumartesi","haftaninGunu":6,"birlestirme":true},{"n":133,"konu":"Ortamlar.","ozet":"Geliştirme, test ve üretim aynı kodu farklı değişkenle çalıştırır.","ayrinti":"NODE_ENV tek başına yeter sanma. Asıl fark DATABASE_URL ve çerez Secure bayrağıdır. Test veritabanı geliştirme veritabanı olmasın. Bir testi yanlışlıkla geliştirme verisine yazmayı açılış kontrolüyle engelle: test komutu test adlı veritabanı istiyorsa ona bak.","uygulama":"Üç örnek ortam dosyası yaz, sır olmadan.\nTest komutu, veritabanı adında test yoksa açılmasın.","bitti":"Yanlış veritabanı adıyla test açılmıyor. Üç örnek dosya duruyor.","ornek":null,"hafta":23,"tarih":"2027-03-22","tarihYazi":"22 Mart 2027 pazartesi","haftaninGunu":1,"birlestirme":false},{"n":134,"konu":"Sır ortamda.","ozet":"Şifre, oturum sırrı ve veritabanı adresi imajın içinde değildir.","ayrinti":"Kodda ve compose dosyasında düz şifre araması yap. Varsa çıkar. Örnek dosyada changeme gibi yer tutucu olabilir, gerçek olmasın. Gün notuna: sır tablete kopyalanmaz.","uygulama":"Depoda gizli dize arayan kısa bir test veya komut yaz.\nÖrnek dosyalar temiz olsun.\nGerçek .env git durumunda görünmesin.","bitti":"Arama temiz. git status .env göstermiyor.","ornek":null,"hafta":23,"tarih":"2027-03-23","tarihYazi":"23 Mart 2027 salı","haftaninGunu":2,"birlestirme":false},{"n":135,"konu":"İmaj, root değil.","ozet":"Uygulama konteyneri root kullanıcısıyla çalışmaz.","ayrinti":"Dockerfile: Node 20, üretim bağımlılıkları, USER node. Geliştirme aracını imaja koyma. .env kopyalama. Sağlık kontrolü /health. İmajı her seferinde latest diye ezme; bugün yerel etiket yeter.","uygulama":"Dockerfile yaz.\nİmajı kur.\nİçerde whoami node olsun.\nUygulama o imajda /health versin.","bitti":"whoami node. /health 200. İmajda .env yok.","ornek":null,"hafta":23,"tarih":"2027-03-24","tarihYazi":"24 Mart 2027 çarşamba","haftaninGunu":3,"birlestirme":false},{"n":136,"konu":"Tek komut.","ozet":"compose up servisi ve veritabanını kaldırır. Migration açılışta uygulanır.","ayrinti":"İnsan adımı kaldıysa komut değildir. Açılış migration'ı iki süreç aynı anda basarsa çakışır. Tek süreçlik bu seride açılışta uygulamak kabul. İki süreç olursa kilit gerekir; bunu gün notuna sınır olarak yaz.","uygulama":"Temiz volume ile docker compose up.\nMigration kendiliğinden basılsın.\nİkinci kez up, migration'ı tekrar basmasın.","bitti":"İki kalkış da çalışıyor. İkinci kalkış eski migration'ı yeniden yazmıyor.","ornek":null,"hafta":23,"tarih":"2027-03-25","tarihYazi":"25 Mart 2027 perşembe","haftaninGunu":4,"birlestirme":false},{"n":137,"konu":"Duman testi.","ozet":"Kalkan servise dışarıdan üç istek. Testin içi değil, ayakta mı diye.","ayrinti":"/health 200, /ready 200, /v1/login bozuk gövdeyle 400 veya 401. 500 görürsen duman kırmızıdır. Duman, birim testin yerine geçmez.","uygulama":"Küçük bir node dosyası bu üç isteği atsın.\nBiri 500 ise çıkış kodu 1 olsun.\nKomutu npm script yap.","bitti":"Komut yeşil. Bilerek ready bozulunca komut kırmızı.","ornek":null,"hafta":23,"tarih":"2027-03-26","tarihYazi":"26 Mart 2027 cuma","haftaninGunu":5,"birlestirme":false},{"n":138,"konu":"Haftalık: temiz makinede servis ayakta.","ozet":"Volume yok, imaj var, tek komut, duman yeşil.","ayrinti":"Tablet bu işi çalıştırmaz. Node'un ve Docker'ın olduğu yerde çalışır. Sen komutları tabletteki sayfadan okursun.","uygulama":"Volume sil.\ncompose up.\nDuman testi.\nSonucu gün notuna yaz.","bitti":"Duman yeşil. Kurulum adımı üç satırı geçmiyor.","ornek":null,"hafta":23,"tarih":"2027-03-27","tarihYazi":"27 Mart 2027 cumartesi","haftaninGunu":6,"birlestirme":true},{"n":139,"konu":"Bir isteği olay döngüsünde anlat.","ozet":"GET /v1/notes geldiğinde süreç ne yapar, sırayla.","ayrinti":"Kabul, senkron middleware, await depo, microtask, cevap, log. Uzun senkron iş yok. Bunu ezber cümle değil, kendi koduna bakarak yaz.","uygulama":"Kendi kodundan sekiz satırlık bir sıra yaz.\nHangi satırın await olduğunu işaretle.\nYanına, o await sırasında başka isteğin girebildiğini bir cümleyle ekle.","bitti":"Sekiz satır gün notunda ve kodla uyumlu.","ornek":null,"hafta":24,"tarih":"2027-03-29","tarihYazi":"29 Mart 2027 pazartesi","haftaninGunu":1,"birlestirme":false},{"n":140,"konu":"Transaction'ı bilerek boz.","ozet":"İz yazımı düşünce not da kalmaz. Bunu yeniden gör.","ayrinti":"Hafıza tazelemek için testi kapat, boz, kırmızı gör, aç. Yeni özellik yok.","uygulama":"note_events insert'ini geçici olarak hata versin.\nNotun da rollback olduğunu gör.\nSonra hatayı kaldır, test yeşil kalsın.","bitti":"Kırmızı hali gördün. Bıraktığın kod yeşil.","ornek":null,"hafta":24,"tarih":"2027-03-30","tarihYazi":"30 Mart 2027 salı","haftaninGunu":2,"birlestirme":false},{"n":141,"konu":"Başkasının notunu silmeyi kapat.","ozet":"Yetki deliği varsa bugün kapanır.","ayrinti":"İki kullanıcı. Biri diğerinin id'sini DELETE eder. 403 ve satır durur. Liste, arama, export, iz. Dört kapıda da sızıntı yok.","uygulama":"Dört testi yan yana çalıştır.\nBiri kırmızıysa düzelt.\nSorguda user_id şartını tekrar oku.","bitti":"Dört test yeşil.","ornek":null,"hafta":24,"tarih":"2027-03-31","tarihYazi":"31 Mart 2027 çarşamba","haftaninGunu":3,"birlestirme":false},{"n":142,"konu":"İşi iki kez çalıştır.","ozet":"Aynı artçı iş ikinci kez etki etmez.","ayrinti":"İşçiyi bilerek iki tur çağır. Sayaç bir. Anahtar unique. Bunu kapak haftasında yeniden gör, çünkü üretimde çökme budur.","uygulama":"Testi çalıştır.\nAnahtarı kaldırınca sayacın ikiye çıktığını gör, anahtarı geri koy.","bitti":"Anahtarlı hali yeşil. Anahtarsız hali neden kırmızı, bir cümle yazılı.","ornek":null,"hafta":24,"tarih":"2027-04-01","tarihYazi":"1 Nisan 2027 perşembe","haftaninGunu":4,"birlestirme":false},{"n":143,"konu":"Yük sayısı.","ozet":"Son bir ölçüm. Bütçeyle karşılaştır.","ayrinti":"Aynı istek sayısı, aynı eşzamanlılık. Sayı bütçenin üstündeyse sebebi uydurma, bir cümleyle ne gördüğünü yaz. Bugün onu optimize etme turuna çevirme. Ölçüm dürüst olsun.","uygulama":"GET /v1/notes yükünü tekrar çalıştır.\nGün 120 bütçesinin yanına bugünkü sayıyı yaz.","bitti":"İki sayı yan yana. Aradaki fark için bir cümle var.","ornek":null,"hafta":24,"tarih":"2027-04-02","tarihYazi":"2 Nisan 2027 cuma","haftaninGunu":5,"birlestirme":false},{"n":144,"konu":"Haftalık: servisi baştan sona anlat.","ozet":"Tek sayfa. Başkası bu sayfayla servisi ayağa kaldırır ve nerede ne olduğunu görür.","ayrinti":"Sayfada: ne işe yarar, nasıl kalkar, /v1 uçları, hata şekli, olay döngüsünde bir istek, transaction, yetki, kuyruk, önbellek sınırı, yük sayısı. Yeni özellik yok. Bu sayfa kodun yerine geçmez, kapıdır.","uygulama":"SERVİS.md yaz.\nDuman testini o sayfadaki komutla çalıştır.\nSayfa üç ekranı geçmesin; tabletten okunacak.","bitti":"SERVİS.md duruyor. İçindeki komut duman testini geçiriyor. Yeni çerçeve yok.","ornek":null,"hafta":24,"tarih":"2027-04-03","tarihYazi":"3 Nisan 2027 cumartesi","haftaninGunu":6,"birlestirme":true}]};
  </script>
  <script>
(function () {
  const seri = globalThis.SERI;
  if (!seri) {
    document.body.textContent = "Müfredat yüklenmedi.";
    return;
  }

  const BITTI = "js-seri-bitti";
  const TEMA = "js-seri-tema";
  const SAAT = "js-seri-saat";
  const ekran = document.querySelector("#ekran");
  const baslik = document.querySelector("#baslik");
  const nav = document.querySelector(".alt");

  const tema = localStorage.getItem(TEMA) || "sistem";
  document.documentElement.dataset.tema = tema;

  function esc(value) {
    return String(value).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;",
    })[ch]);
  }

  function yerelIso(date = new Date()) {
    const kaydir = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
    return kaydir.toISOString().slice(0, 10);
  }

  function bittiOku() {
    try {
      return JSON.parse(localStorage.getItem(BITTI) || "{}");
    } catch {
      return {};
    }
  }

  function bittiYaz(map) {
    localStorage.setItem(BITTI, JSON.stringify(map));
  }

  function saatBaslangic() {
    return {
      faz: 0,
      kalanMs: seri.bloklar[0].dk * 60000,
      calisiyor: false,
      bitis: null,
      bitti: false,
    };
  }

  function saatOku() {
    try {
      const ham = JSON.parse(sessionStorage.getItem(SAAT) || "null");
      if (!ham || !Number.isFinite(ham.faz)) return saatBaslangic();
      return ham;
    } catch {
      return saatBaslangic();
    }
  }

  function saatYaz(saat) {
    sessionStorage.setItem(SAAT, JSON.stringify(saat));
  }

  function tick() {
    const saat = saatOku();
    if (!saat.calisiyor || saat.bitti) return saat;
    let kalan = saat.bitis - Date.now();
    let faz = saat.faz;
    let titret = false;
    while (kalan <= 0 && faz < seri.bloklar.length - 1) {
      faz += 1;
      kalan += seri.bloklar[faz].dk * 60000;
      titret = true;
    }
    if (titret && navigator.vibrate) navigator.vibrate(40);
    if (kalan <= 0) {
      const bitti = { faz: seri.bloklar.length - 1, kalanMs: 0, calisiyor: false, bitis: null, bitti: true };
      saatYaz(bitti);
      return bitti;
    }
    const sonraki = { faz, kalanMs: kalan, calisiyor: true, bitis: Date.now() + kalan, bitti: false };
    saatYaz(sonraki);
    return sonraki;
  }

  function sureYazi(ms) {
    const toplam = Math.max(0, Math.ceil(ms / 1000));
    const dakika = String(Math.floor(toplam / 60)).padStart(2, "0");
    const saniye = String(toplam % 60).padStart(2, "0");
    return `${dakika}:${saniye}`;
  }

  function bugun() {
    return yerelIso();
  }

  function gunBul(n) {
    return seri.gunler.find((gun) => gun.n === Number(n));
  }

  function takvimGunu() {
    return seri.gunler.find((gun) => gun.tarih === bugun()) || null;
  }

  function seciliNo() {
    const hash = location.hash;
    const ders = hash.match(/^#\/ders\/(\d+)$/);
    if (ders) return Number(ders[1]);
    const takvim = takvimGunu();
    if (takvim) return takvim.n;
    if (bugun() > seri.meta.bitis) return 144;
    return 1;
  }

  function durum(gun) {
    if (bittiOku()[gun.n]) return "bitti";
    if (gun.tarih === bugun()) return "bugun";
    if (gun.tarih < bugun()) return "kacti";
    return "gelecek";
  }

  function durumYazi(kod) {
    if (kod === "bitti") return "bitti";
    if (kod === "bugun") return "bugün";
    if (kod === "kacti") return "kaçtı";
    return "";
  }

  function paragraflar(metin) {
    return metin
      .split(/\n+/)
      .filter((satir) => satir.trim())
      .map((satir) => `<p>${esc(satir)}</p>`)
      .join("");
  }

  function saatKutusu() {
    const saat = tick();
    const blok = seri.bloklar[saat.faz];
    const etiket = saat.bitti ? "3 saat doldu" : blok.ad;
    const yazi = saat.bitti ? "Günün süresi bitti. Bitiş şartına bak." : blok.yazi;
    const dugme = saat.calisiyor ? "Duraklat" : "Başlat";
    return `<section class="saat" aria-label="Günün süresi">
      <div class="saat-ust">
        <p class="faz" data-faz>${esc(etiket)}</p>
        <p class="sure" data-sure>${sureYazi(saat.kalanMs)}</p>
      </div>
      <p class="faz-yazi" data-faz-yazi>${esc(yazi)}</p>
      <div class="saat-dugmeler">
        <button type="button" data-eylem="baslat" data-baslat>${dugme}</button>
        <button type="button" data-eylem="sifirla" class="ikincil">Sıfırla</button>
      </div>
    </section>`;
  }

  function sayilar() {
    const meta = seri.meta;
    return `<dl class="sayilar">
      <div><dt>Günde</dt><dd>3 saat</dd></div>
      <div><dt>Bitiş</dt><dd>3 Nisan 2027</dd></div>
      <div><dt>Toplam</dt><dd>432 saat</dd></div>
    </dl>
    <p class="genis">${esc(meta.baslangicYazi)} başlar. ${esc(meta.bitisYazi)} biter. 24 hafta, 144 gün. Pazartesi–cumartesi, pazar yok.</p>`;
  }

  function ekranBugun() {
    const iso = bugun();
    const meta = seri.meta;
    baslik.textContent = "Bugün";
    if (iso < meta.baslangic) {
      ekran.innerHTML = `${sayilar()}
        <p>Takvim ${esc(meta.baslangicYazi)} işler. İstersen gün 1'i bugünden oku. Kaçırılan gün, başlayınca üst üste binmez.</p>
        <button type="button" class="tam" data-eylem="gun" data-n="1">Gün 1'i aç</button>
        <h2>İlk hafta</h2>
        ${haftaListesi(1)}`;
      return;
    }
    if (iso > meta.bitis) {
      const sayi = Object.keys(bittiOku()).length;
      ekran.innerHTML = `${sayilar()}
        <p>Seri bitti. İşaretlediğin gün: ${sayi} / 144.</p>
        <button type="button" class="tam" data-eylem="gun" data-n="144">Son günü aç</button>`;
      return;
    }
    const gun = takvimGunu();
    if (!gun) {
      const yarin = seri.gunler.find((aday) => aday.tarih > iso);
      baslik.textContent = "Pazar";
      ekran.innerHTML = `<p>Bugün pazar. Seri durur.</p>
        <p>Yarın gün ${yarin.n}: ${esc(yarin.konu)}</p>
        <button type="button" class="tam" data-eylem="gun" data-n="${yarin.n}">Yarının dersini aç</button>`;
      return;
    }
    const kac = seri.gunler.filter((aday) => durum(aday) === "kacti").length;
    const kacYazi = kac ? `<p class="kacak">${kac} gün kaçtı. Ekleme. Bugünün konusu aşağıda.</p>` : "";
    ekran.innerHTML = `${saatKutusu()}
      <p class="kicker">Gün ${gun.n} · Hafta ${gun.hafta} · ${esc(gun.tarihYazi)}</p>
      <h2>${esc(gun.konu)}</h2>
      ${kacYazi}
      ${paragraflar(gun.ozet)}
      <button type="button" class="tam" data-eylem="gun" data-n="${gun.n}">Dersin tamamı</button>`;
  }

  function ekranDers(n) {
    const gun = gunBul(n) || gunBul(1);
    const hafta = seri.haftalar[gun.hafta - 1];
    const kod = durum(gun);
    baslik.textContent = `Gün ${gun.n}`;
    const ornek = gun.ornek ? `<h2>Kısa örnek</h2><pre>${esc(gun.ornek)}</pre>` : "";
    const onceki = gun.n > 1 ? `<button type="button" data-eylem="gun" data-n="${gun.n - 1}">Önceki</button>` : "";
    const sonraki = gun.n < 144 ? `<button type="button" data-eylem="gun" data-n="${gun.n + 1}">Sonraki</button>` : "";
    const bitti = kod === "bitti";
    ekran.innerHTML = `${saatKutusu()}
      <p class="kicker">Hafta ${hafta.n} · ${esc(hafta.ad)} · ${esc(gun.tarihYazi)}</p>
      <h2>${esc(gun.konu)}</h2>
      <p class="durum ${kod}">${durumYazi(kod)}</p>
      <h2>Kavram</h2>
      ${paragraflar(gun.ozet)}
      ${paragraflar(gun.ayrinti)}
      ${ornek}
      <h2>Uygulama</h2>
      ${paragraflar(gun.uygulama)}
      <h2>Bitti sayılır</h2>
      <p>${esc(gun.bitti)}</p>
      <button type="button" class="tam" data-eylem="bitti" data-n="${gun.n}">${bitti ? "İşareti kaldır" : "Bugün bitti"}</button>
      <div class="yan">${onceki}${sonraki}</div>`;
  }

  function haftaListesi(haftaNo) {
    const hafta = seri.haftalar[haftaNo - 1];
    const maddeler = hafta.gunler
      .map((n) => {
        const gun = gunBul(n);
        const kod = durum(gun);
        return `<li>
          <button type="button" data-eylem="gun" data-n="${gun.n}">
            <span class="gun-no">${gun.haftaninGunu}</span>
            <span class="gun-konu">${esc(gun.konu)}</span>
            <span class="durum ${kod}">${durumYazi(kod)}</span>
          </button>
        </li>`;
      })
      .join("");
    return `<p>${esc(hafta.amac)}</p><ol class="gunler">${maddeler}</ol>`;
  }

  function ekranMufredat() {
    baslik.textContent = "Müfredat";
    const sayi = Object.keys(bittiOku()).length;
    const acik = takvimGunu()?.hafta || 1;
    const bloklar = seri.haftalar
      .map((hafta) => {
        const ac = hafta.n === acik ? " open" : "";
        return `<details${ac}>
          <summary>
            <span>Hafta ${hafta.n}</span>
            <strong>${esc(hafta.ad)}</strong>
            <span class="ozet-tarih">${esc(hafta.baslangicYazi)}</span>
          </summary>
          ${haftaListesi(hafta.n)}
        </details>`;
      })
      .join("");
    ekran.innerHTML = `<p>${sayi} / 144 işaretli. ${esc(seri.meta.baslangicYazi)} – ${esc(seri.meta.bitisYazi)}.</p>
      <div class="cubuk" aria-hidden="true"><span style="width:${(sayi / 144) * 100}%"></span></div>
      <div class="haftalar">${bloklar}</div>`;
  }

  function ekranDuzen() {
    baslik.textContent = "Düzen";
    const temaSimdi = document.documentElement.dataset.tema;
    ekran.innerHTML = `${sayilar()}
      <h2>Üç saat nasıl bölünür</h2>
      <ol class="bloklar">
        ${seri.bloklar
          .map((blok) => `<li><strong>${blok.dk} dk</strong> ${esc(blok.ad)}. ${esc(blok.yazi)}</li>`)
          .join("")}
      </ol>
      <h2>Tablet</h2>
      <p>Sayfayı dikey tut. Satır kısa kalsın.</p>
      <p>Kod bloğu 70 dakikadır. Cam klavye yetmez. Bluetooth klavye bağla.</p>
      <p>Node 20 bu depoda çalışır. Tablet Node çalıştırmıyorsa tabletin tarayıcısında bir bulut ortam aç; test orada koşar. Gün 1 komutu npm run day.</p>
      <p>Docker 32. günde, Node'un çalıştığı yerdedir. Tablete Docker kurma.</p>
      <h2>Kaçırılan gün</h2>
      <p>Ertelenmez. Ertesi gün bir sonraki konudur. Aynı günü iki kez yapmak serbest; sıradaki günü biriktirmek değil.</p>
      <h2>İşaret</h2>
      <p>Bitti işareti bu tarayıcıda durur. Başka cihaza geçmez. Çözüm depoda yok. Bitiş şartı sözleşmedir.</p>
      <h2>Görünüm</h2>
      <div class="yan">
        <button type="button" data-eylem="tema" data-tema="acik" ${temaSimdi === "acik" ? "aria-pressed=\"true\"" : ""}>Açık</button>
        <button type="button" data-eylem="tema" data-tema="koyu" ${temaSimdi === "koyu" ? "aria-pressed=\"true\"" : ""}>Koyu</button>
        <button type="button" data-eylem="tema" data-tema="sistem" ${temaSimdi === "sistem" ? "aria-pressed=\"true\"" : ""}>Sistem</button>
      </div>`;
  }

  function ciz() {
    const hash = location.hash || "#/bugun";
    const ders = hash.match(/^#\/ders\/(\d+)$/);
    let bolum = "bugun";
    if (ders) {
      bolum = "ders";
      ekranDers(ders[1]);
    } else if (hash.startsWith("#/mufredat")) {
      bolum = "mufredat";
      ekranMufredat();
    } else if (hash.startsWith("#/duzen")) {
      bolum = "duzen";
      ekranDuzen();
    } else if (hash.startsWith("#/ders")) {
      bolum = "ders";
      ekranDers(seciliNo());
    } else {
      ekranBugun();
    }
    for (const dugme of nav.querySelectorAll("button")) {
      dugme.setAttribute("aria-current", dugme.dataset.git === bolum ? "page" : "false");
    }
    saatCiz();
    baslik.focus({ preventScroll: true });
  }

  function saatCiz() {
    const saat = tick();
    const sure = ekran.querySelector("[data-sure]");
    if (!sure) return;
    const blok = seri.bloklar[saat.faz];
    sure.textContent = sureYazi(saat.kalanMs);
    ekran.querySelector("[data-faz]").textContent = saat.bitti ? "3 saat doldu" : blok.ad;
    ekran.querySelector("[data-faz-yazi]").textContent = saat.bitti
      ? "Günün süresi bitti. Bitiş şartına bak."
      : blok.yazi;
    ekran.querySelector("[data-baslat]").textContent = saat.calisiyor ? "Duraklat" : "Başlat";
  }

  nav.addEventListener("click", (event) => {
    const git = event.target.closest("button")?.dataset.git;
    if (!git) return;
    if (git === "ders") {
      location.hash = `#/ders/${seciliNo()}`;
      return;
    }
    location.hash = `#/${git}`;
  });

  document.body.addEventListener("click", (event) => {
    const hedef = event.target.closest("[data-eylem]");
    if (!hedef) return;
    const eylem = hedef.dataset.eylem;
    if (eylem === "gun") {
      location.hash = `#/ders/${hedef.dataset.n}`;
      return;
    }
    if (eylem === "baslat") {
      const saat = tick();
      if (saat.bitti) return;
      if (saat.calisiyor) {
        saatYaz({
          faz: saat.faz,
          kalanMs: Math.max(0, saat.bitis - Date.now()),
          calisiyor: false,
          bitis: null,
          bitti: false,
        });
      } else {
        saatYaz({
          faz: saat.faz,
          kalanMs: saat.kalanMs,
          calisiyor: true,
          bitis: Date.now() + saat.kalanMs,
          bitti: false,
        });
      }
      saatCiz();
      return;
    }
    if (eylem === "sifirla") {
      if (!window.confirm("Süreyi başa almak istiyor musun?")) return;
      saatYaz(saatBaslangic());
      saatCiz();
      return;
    }
    if (eylem === "bitti") {
      const map = bittiOku();
      const n = String(hedef.dataset.n);
      if (map[n]) delete map[n];
      else map[n] = bugun();
      bittiYaz(map);
      ciz();
      return;
    }
    if (eylem === "tema") {
      document.documentElement.dataset.tema = hedef.dataset.tema;
      localStorage.setItem(TEMA, hedef.dataset.tema);
      ciz();
    }
  });

  window.addEventListener("hashchange", () => {
    ciz();
    window.scrollTo(0, 0);
  });

  if (!location.hash) location.hash = "#/bugun";
  ciz();
  setInterval(saatCiz, 400);
})();

  </script>
</body>
</html>
