<!DOCTYPE html>
<html lang="tr" data-tema="sistem">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="JS Seri">
  <meta name="theme-color" content="#f3f0e8">
  <title>Backend JavaScript</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f0e8;
      --paper: #fbf9f4;
      --ink: #1c1915;
      --muted: #5e584e;
      --line: #ddd6c8;
      --accent: #0c5c4a;
      --warn: #8a4b12;
      --code: #efeae0;
      --tap: #e7f2ee;
    }
    :root[data-tema="koyu"] {
      color-scheme: dark;
      --bg: #141311;
      --paper: #1c1b17;
      --ink: #f3efe6;
      --muted: #b7b0a4;
      --line: #343029;
      --accent: #8fd0b8;
      --warn: #e2b07a;
      --code: #26231e;
      --tap: #1a2a24;
    }
    @media (prefers-color-scheme: dark) {
      :root[data-tema="sistem"] {
        color-scheme: dark;
        --bg: #141311;
        --paper: #1c1b17;
        --ink: #f3efe6;
        --muted: #b7b0a4;
        --line: #343029;
        --accent: #8fd0b8;
        --warn: #e2b07a;
        --code: #26231e;
        --tap: #1a2a24;
      }
    }
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 18px/1.5 Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
    }
    button, nav, summary { font: 17px/1.3 ui-sans-serif, system-ui, sans-serif; }
    .ust, main { max-width: 40rem; margin: 0 auto; padding: 20px 20px 0; }
    main { padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
    h1, h2 { font-weight: 650; line-height: 1.25; }
    h1 { margin: 0; font-size: 26px; }
    h2 { margin: 28px 0 8px; font-size: 20px; }
    p { margin: 0 0 12px; }
    .ust-ad, .kicker, .ozet-tarih, .durum {
      font-family: ui-sans-serif, system-ui, sans-serif;
      color: var(--muted);
      font-size: 14px;
    }
    .ust-ad { margin: 0 0 4px; letter-spacing: 0.04em; text-transform: uppercase; }
    .kicker { margin-bottom: 6px; }
    .sayilar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 8px 0 16px;
    }
    .sayilar div { border-top: 2px solid var(--accent); padding-top: 8px; }
    .sayilar dt { font-family: ui-sans-serif, system-ui, sans-serif; color: var(--muted); font-size: 14px; }
    .sayilar dd { margin: 4px 0 0; font-size: 22px; }
    .genis { font-size: 17px; }
    button {
      min-height: 48px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      padding: 10px 14px;
      border-radius: 6px;
    }
    button.tam, .saat-dugmeler button:first-child { background: var(--accent); color: #f7fffb; border-color: var(--accent); }
    :root[data-tema="koyu"] button.tam,
    :root[data-tema="koyu"] .saat-dugmeler button:first-child { color: #10231c; }
    @media (prefers-color-scheme: dark) {
      :root[data-tema="sistem"] button.tam,
      :root[data-tema="sistem"] .saat-dugmeler button:first-child { color: #10231c; }
    }
    button.tam { width: 100%; margin: 8px 0 16px; }
    button.ikincil, .yan button { background: transparent; }
    button[aria-pressed="true"] { background: var(--tap); border-color: var(--accent); }
    .saat {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
      padding: 10px 0 12px;
      margin: 0 -20px 16px;
      padding-left: 20px;
      padding-right: 20px;
    }
    .saat-ust { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .faz { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 15px; }
    .sure { margin: 0; font-variant-numeric: tabular-nums; font-size: 32px; line-height: 1; }
    .faz-yazi { color: var(--muted); font-size: 16px; margin: 6px 0 10px; }
    .saat-dugmeler, .yan { display: flex; gap: 8px; }
    .saat-dugmeler button, .yan button { flex: 1; }
    .yan { margin-top: 12px; }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--code);
      padding: 12px 14px;
      font: 15px/1.45 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      margin: 0 0 16px;
    }
    .kacak { color: var(--warn); }
    .durum.bitti, .durum.bugun { color: var(--accent); }
    .durum.kacti { color: var(--warn); }
    .cubuk { height: 6px; background: var(--line); margin: 8px 0 18px; }
    .cubuk > span { display: block; height: 100%; background: var(--accent); }
    details { border-top: 1px solid var(--line); }
    summary {
      min-height: 56px;
      display: grid;
      grid-template-columns: auto 1fr;
      grid-template-rows: auto auto;
      column-gap: 12px;
      align-items: center;
      cursor: pointer;
      padding: 8px 0;
    }
    summary strong { font-size: 18px; }
    .ozet-tarih { grid-column: 2; }
    .gunler { list-style: none; margin: 0 0 16px; padding: 0; }
    .gunler button {
      width: 100%;
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 10px;
      text-align: left;
      align-items: start;
      background: transparent;
      border: 0;
      border-top: 1px solid var(--line);
      border-radius: 0;
      padding: 12px 0;
      color: inherit;
      font: inherit;
    }
    .gun-no { font-family: ui-sans-serif, system-ui, sans-serif; color: var(--muted); }
    .gun-konu { font-size: 17px; }
    .bloklar { margin: 0 0 16px; padding-left: 20px; }
    .bloklar li { margin: 0 0 8px; }
    .alt {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--paper);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 3;
    }
    .alt button {
      min-height: 52px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
    }
    .alt button[aria-current="page"] { color: var(--accent); font-weight: 650; }
    @media (max-width: 520px) {
      .sayilar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="ust">
    <p class="ust-ad">Backend JavaScript</p>
    <h1 id="baslik" tabindex="-1">Bugün</h1>
  </header>
  <main id="ekran"></main>
  <nav class="alt" aria-label="Bölümler">
    <button type="button" data-git="bugun">Bugün</button>
    <button type="button" data-git="ders">Ders</button>
    <button type="button" data-git="mufredat">Müfredat</button>
    <button type="button" data-git="duzen">Düzen</button>
  </nav>
  <script>
/*__VERI__*/
  </script>
  <script>
/*__APP__*/
  </script>
</body>
</html>
